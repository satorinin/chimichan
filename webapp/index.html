<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chimichan MVP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
    }
    textarea, div {
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      height: 150px;
      resize: none;
    }
    #output, #intermediate {
      height: 300px;
      overflow-y: auto;
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>Chimichan MVP</h1>
  <div id="app">
    <textarea id="input" placeholder="Enter Japanese text here..."></textarea>
    <div id="output">Decorated output will appear here...</div>
    <div id="intermediate">Intermediate parsing results will appear here...</div>
  </div>
  <script src="app.js"></script>
</body>
</html>
