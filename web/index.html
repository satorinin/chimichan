<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kuromoji.js demo — Chimichan</title>
  <style>
    /* Light theme: neutral GitHub-like palette */
    :root{
      --bg: #f6f8fa;       /* page background */
      --card: #ffffff;     /* card background */
      --muted: #6e7781;    /* subtle text */
      --accent: #0366d6;   /* blue accent */
      --accent-2: #0356b6; /* darker blue */
      --surface: #ffffff;  /* surface */
      --glass: rgba(2,6,23,0.04);
      --text-dark: #0b1220;/* primary text */
      --text-light: #ffffff;
    }
    html,body{height:100%}
    body {
      margin:0; min-height:100%; background:linear-gradient(180deg,var(--bg), #eef3f7 80%);
      color: var(--text-dark); font-family: Inter, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; padding:40px;
    }
    #app{ max-width:980px; margin:0 auto; }
  .card{ background:var(--card); border-radius:12px; padding:20px; box-shadow:0 6px 18px rgba(10,20,30,0.06); border:1px solid rgba(2,6,23,0.04)}
  h1{ margin:0 0 8px 0; font-weight:600; font-size:22px; color:var(--text-dark) }
  p { margin:0 0 14px 0; color:var(--muted); }
    label[for="input"]{ display:block; margin-top:8px; margin-bottom:6px; color:var(--muted); }
    textarea { width:100%; height:140px; font-size:15px; padding:12px; border-radius:8px; border:1px solid var(--glass); background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent); color:inherit; resize:vertical }
    .controls{ display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap }
    .status-badge{ background:rgba(255,255,255,0.02); color:var(--muted); padding:6px 10px; border-radius:999px; font-size:13px; border:1px solid rgba(255,255,255,0.02) }
  .row .parse-btn, button{ background:linear-gradient(180deg,var(--accent),var(--accent-2)); color:var(--text-light); border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600 }
    .parse-btn[disabled]{ opacity:0.45; cursor:not-allowed }
    select, input[type="checkbox"]{ font-size:13px }
  .result{ margin-top:16px; background:var(--surface); padding:14px; border-radius:10px; border:1px solid rgba(2,6,23,0.04); }
  .json-output{ font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Noto Sans Mono', monospace; font-size:13px; color:var(--text-dark); background:linear-gradient(180deg, rgba(2,6,23,0.02), transparent); padding:8px; border-radius:6px }
    .tokens-table{ width:100%; border-collapse:collapse; font-size:13px }
  .tokens-table th{ position:sticky; top:0; background:var(--card); color:var(--accent); text-align:left; padding:10px; border-bottom:1px solid rgba(2,6,23,0.06) }
  .tokens-table td{ padding:10px; border-bottom:1px dashed rgba(2,6,23,0.04) }
  .tokens-table tr:nth-child(even) td{ background:rgba(2,6,23,0.02) }
    .tokens-table-container{ overflow:auto; max-height:50vh; border-radius:8px }
    footer.app-footer{ margin-top:18px; color:var(--muted); font-size:13px; text-align:right }
    @media (max-width:640px){ .controls{ flex-direction:column; align-items:stretch } }
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <h1>Kuromoji.js tokenizer — demo</h1>
      <p>Paste Japanese text below and press <strong>Parse</strong>. The demo uses a vendored kuromoji build and local dictionaries so it works offline.</p>

      <label for="input">Japanese text</label>
      <textarea id="input">すもももももももものうち</textarea>

      <div class="controls row">
        <button id="parse" class="parse-btn" disabled>Parse</button>
        <span id="status" class="status-badge">Loading tokenizer…</span>
        <label style="margin-left:12px; display:flex; align-items:center; gap:6px; color:var(--muted)">
          <input type="checkbox" id="autoSelection" checked />
          <small>Auto-parse selection</small>
        </label>
  <select id="format">
          <option value="json" selected>JSON (pretty)</option>
          <option value="table">Table (simple)</option>
  </select>
        <!-- AnkiConnect controls -->
        <label style="display:flex; align-items:center; gap:6px; margin-left:6px;">
          <input id="ankiAddress" type="text" style="width:220px; padding:6px; border-radius:6px; border:1px solid var(--glass)" placeholder="http://127.0.0.1:8765" />
        </label>
        <button id="ankiFetch" title="Fetch decks from AnkiConnect">Fetch decks</button>
        <span id="ankiStatus" class="status-badge" aria-live="polite">Anki: idle</span>
        <select id="ankiDecks" style="margin-left:6px"><option value="">(no deck)</option></select>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h3 style="margin-top:0">Result</h3>
      <div id="result" class="result" role="region" aria-live="polite">(waiting for tokenizer)</div>
    </div>

    <footer class="app-footer">Chimichan — kuromoji demo · vendored offline tokenizer</footer>
  </div>

  <!-- Load vendored kuromoji and dictionaries so the demo can run offline/inside an extension. -->
  <script src="./vendor/kuromoji.js"></script>
  <!-- Load our app as an ES module. kuromoji is exposed as a global by the vendored file. -->
  <script type="module" src="./main.js"></script>
</body>
</html>
