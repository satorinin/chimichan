<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kuromoji.js demo — Chimichan</title>
  <style>
    body { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; padding: 24px; }
    textarea { width: 100%; height: 120px; font-size: 16px; }
    pre { background:#111; color:#eee; padding:12px; overflow:auto; max-height: 50vh; }
    .row { display:flex; gap:12px; align-items:center; margin-top:12px; }
    button { padding:8px 12px; font-size:16px; }
    footer { margin-top:18px; color:#666; font-size:14px }
  </style>
</head>
<body>
  <h1>Kuromoji.js tokenizer — demo</h1>

  <p>Paste Japanese text below and press <strong>Parse</strong>. The page loads <code>kuromoji.js</code> from a CDN and initializes the dictionary files automatically.</p>

  <label for="input">Japanese text</label>
  <textarea id="input">すもももももももものうち</textarea>

  <div class="row">
    <button id="parse" disabled>Parse</button>
    <span id="status">Loading tokenizer…</span>
    <select id="format">
      <option value="json" selected>JSON (pretty)</option>
      <option value="table">Table (simple)</option>
    </select>
  </div>

  <h3>Result</h3>
  <pre id="result">(waiting for tokenizer)</pre>

  <!-- Load kuromoji from unpkg. We use @latest so maintainers don't need to pin a version here. -->
  <script src="https://unpkg.com/kuromoji@latest/build/kuromoji.js"></script>
  <!-- Load our app as an ES module. We keep kuromoji as a global loaded above. -->
  <script type="module" src="./main.js"></script>
</body>
</html>
